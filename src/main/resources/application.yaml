spring:
  application:
    name: tenant-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/tenant_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # TODO: flyway 적용 후 validate로 바꿔야됨
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}